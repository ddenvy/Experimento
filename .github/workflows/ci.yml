name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest

    # ApiFixture ходит в Postgres и RabbitMQ на localhost с кредами experimento/experimento.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: experimento
          POSTGRES_USER: experimento
          POSTGRES_PASSWORD: experimento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U experimento -d experimento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: experimento
          RABBITMQ_DEFAULT_PASS: experimento
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ci-only-experimento-jwt-signing-key-0123456789abcdef
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=experimento;Username=experimento;Password=experimento
      RabbitMq__Host: localhost
      RabbitMq__Username: experimento
      RabbitMq__Password: experimento

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: NuGet vulnerability audit
        # Падает при уязвимостях (включая транзитивные) — гейт до сборки.
        run: dotnet list Experimento.slnx package --vulnerable --include-transitive
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Run tests (all test projects)
        # Перечисляем тест-проекты явно: интеграционные WebApi.Tests поднимаются на сервисах выше.
        working-directory: backend
        run: |
          for proj in tests/*/*.Tests.csproj; do
            dotnet test "$proj" --no-restore --configuration Release --logger "console;verbosity=minimal"
          done

  frontend:
    name: Frontend typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit dependencies
        # Блокируем high в runtime-зависимостях и critical во всём дереве.
        # High в dev-пути пока не блокируем: транзитивный braces не имеет совместимого исправления.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5126/api

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_KEY: ci-only-experimento-jwt-signing-key-0123456789abcdef
      COMPOSE_PROJECT_NAME: experimento-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start the application stack
        run: docker compose -f docker-compose.yml -f .github/compose.ci.yml up -d --build

      - name: Wait for application readiness
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 --max-time 10 http://localhost:5126/health
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 --max-time 10 http://localhost:3000/

      - name: Seed the local chemical catalog
        run: docker compose -f docker-compose.yml -f .github/compose.ci.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U experimento -d experimento < .github/ci/seed-catalog.sql

      - name: Run browser smoke tests
        run: npm run test:e2e:ci
        working-directory: frontend

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/compose.ci.yml logs --no-color --tail=200

      - name: Upload browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the test stack
        if: always()
        run: docker compose -f docker-compose.yml -f .github/compose.ci.yml down -v
